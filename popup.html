<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>纯回收校验温馨提示弹窗</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 668px;
        height: 1474px;
        margin: 0;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        color: #262626;
        background: #f5f5f5;
      }

      button {
        font-family: inherit;
      }

      .screen {
        position: relative;
        width: 668px;
        height: 1474px;
        background: url("./assets/source-page.png") center top / 668px 1474px no-repeat;
      }

      .mask {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 36px;
        background: rgba(10, 19, 34, 0.58);
        backdrop-filter: blur(1.5px);
      }

      .dialog {
        position: relative;
        width: 590px;
        overflow: hidden;
        border-radius: 12px;
        background: #ffffff;
        box-shadow: 0 28px 76px rgba(0, 0, 0, 0.28);
      }

      .close-button {
        position: absolute;
        z-index: 1;
        top: 14px;
        right: 14px;
        display: grid;
        width: 52px;
        height: 52px;
        padding: 0;
        place-items: center;
        border: 0;
        border-radius: 50%;
        color: #737b87;
        background: transparent;
        cursor: pointer;
      }

      .close-button:hover {
        color: #252b33;
        background: #f2f4f7;
      }

      .close-button svg {
        width: 25px;
        height: 25px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-width: 2.3;
      }

      .content {
        padding: 45px 38px 34px;
      }

      h1 {
        margin: 0 0 28px;
        text-align: center;
        font-size: 34px;
        font-weight: 600;
        line-height: 1.35;
        letter-spacing: 0;
        color: #1f1f1f;
      }

      .message-block {
        padding: 22px 22px 20px;
        border-left: 6px solid #f04438;
        border-radius: 8px;
        background: #fff6f5;
      }

      .message-label {
        display: block;
        margin-bottom: 8px;
        font-size: 21px;
        font-weight: 600;
        line-height: 1.4;
        color: #d92d20;
      }

      .error-message {
        margin: 0;
        font-size: 26px;
        font-weight: 500;
        line-height: 1.62;
        letter-spacing: 0;
        color: #3d3d3d;
      }

      .question {
        margin: 25px 0 16px;
        font-size: 27px;
        font-weight: 600;
        line-height: 1.55;
        letter-spacing: 0;
        color: #1f1f1f;
      }

      .rule-note {
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 10px;
        align-items: start;
        padding: 17px 18px;
        border-radius: 8px;
        font-size: 24px;
        line-height: 1.6;
        letter-spacing: 0;
        color: #36516f;
        background: #f2f7ff;
      }

      .rule-note svg {
        width: 28px;
        height: 28px;
        margin-top: 4px;
        fill: none;
        stroke: #1769ff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 2;
      }

      .actions {
        padding: 27px 38px 36px;
        border-top: 1px solid #ededed;
      }

      .primary {
        width: 100%;
        height: 78px;
        border: 2px solid #1769ff;
        border-radius: 9px;
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0;
        color: #ffffff;
        background: #1769ff;
        box-shadow: 0 10px 24px rgba(23, 105, 255, 0.24);
        cursor: pointer;
      }

      .primary:active {
        transform: translateY(1px);
        box-shadow: 0 6px 16px rgba(23, 105, 255, 0.22);
      }

      .close-button:focus-visible,
      .primary:focus-visible,
      .reopen:focus-visible {
        outline: 4px solid rgba(23, 105, 255, 0.3);
        outline-offset: 3px;
      }

      .reopen {
        position: absolute;
        left: 50%;
        bottom: 32px;
        display: none;
        align-items: center;
        gap: 8px;
        padding: 13px 20px;
        border: 1px solid #a9c8ff;
        border-radius: 999px;
        font-size: 20px;
        font-weight: 600;
        color: #1769ff;
        background: rgba(255, 255, 255, 0.96);
        box-shadow: 0 8px 22px rgba(21, 58, 116, 0.16);
        transform: translateX(-50%);
        cursor: pointer;
      }

      .screen.is-closed .mask {
        display: none;
      }

      .screen.is-closed .reopen {
        display: inline-flex;
      }

      @media (prefers-reduced-motion: no-preference) {
        .dialog {
          animation: dialog-in 180ms ease-out;
        }

        @keyframes dialog-in {
          from {
            opacity: 0;
            transform: translateY(10px) scale(0.985);
          }
          to {
            opacity: 1;
            transform: translateY(0) scale(1);
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="screen" id="screen" aria-label="回收订单报价页面">
      <section class="mask" id="mask" aria-label="温馨提示遮罩">
        <div
          class="dialog"
          id="dialog"
          role="alertdialog"
          aria-modal="true"
          aria-labelledby="dialog-title"
          aria-describedby="dialog-message dialog-rule"
        >
          <button class="close-button" id="close-button" type="button" aria-label="关闭温馨提示">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 6l12 12M18 6L6 18" />
            </svg>
          </button>

          <div class="content">
            <h1 id="dialog-title">温馨提示</h1>

            <div class="message-block">
              <span class="message-label">当前订单提示</span>
              <p class="error-message" id="dialog-message">
                自主控价收益校验未通过，当前订单暂不能参与换新活动。
              </p>
            </div>

            <p class="question">是否按纯回收办理？</p>

            <div class="rule-note" id="dialog-rule">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9"></circle>
                <path d="M12 10.5v6"></path>
                <path d="M12 7.5h.01"></path>
              </svg>
              <span>纯回收不执行该校验，且不参与换新活动。</span>
            </div>
          </div>

          <div class="actions">
            <button class="primary" id="confirm-button" type="button">纯回收不参与活动</button>
          </div>
        </div>
      </section>

      <button class="reopen" id="reopen-button" type="button">重新查看弹窗</button>
    </main>

    <script>
      const screen = document.querySelector("#screen");
      const dialog = document.querySelector("#dialog");
      const closeButton = document.querySelector("#close-button");
      const confirmButton = document.querySelector("#confirm-button");
      const reopenButton = document.querySelector("#reopen-button");
      const message = document.querySelector("#dialog-message");
      const params = new URLSearchParams(window.location.search);
      const dynamicMessage = params.get("error");

      if (dynamicMessage?.trim()) {
        message.textContent = dynamicMessage.trim();
      }

      function closeDialog() {
        screen.classList.add("is-closed");
        reopenButton.focus();
      }

      function reopenDialog() {
        screen.classList.remove("is-closed");
        closeButton.focus();
      }

      closeButton.addEventListener("click", closeDialog);
      confirmButton.addEventListener("click", closeDialog);
      reopenButton.addEventListener("click", reopenDialog);

      dialog.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          event.preventDefault();
          closeDialog();
          return;
        }

        if (event.key !== "Tab") {
          return;
        }

        const focusable = [closeButton, confirmButton];
        const currentIndex = focusable.indexOf(document.activeElement);
        const nextIndex = event.shiftKey
          ? (currentIndex - 1 + focusable.length) % focusable.length
          : (currentIndex + 1) % focusable.length;
        event.preventDefault();
        focusable[nextIndex].focus();
      });
    </script>
  </body>
</html>
